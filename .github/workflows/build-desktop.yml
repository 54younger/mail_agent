# Build the one-click backend binary for Windows, macOS, and Linux with
# PyInstaller, and attach the results to the GitHub Release. Non-technical users
# download the binary for their OS instead of installing Docker or Python.
#
# Triggers on a version tag (e.g. v0.1.0) — the same trigger as docker-publish.yml,
# so one tag ships both the Docker image and the desktop binaries — and on manual
# dispatch (artifacts only, no release).
name: Build desktop binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: mailagent-windows.exe
            built: dist/mailagent.exe
          - os: macos-latest
            artifact: mailagent-macos
            built: dist/mailagent
          - os: ubuntu-latest
            artifact: mailagent-linux
            built: dist/mailagent
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ./backend pyinstaller

      - name: Build binary
        run: pyinstaller backend/mailagent.spec

      - name: Rename to per-OS artifact name
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    # Attach the three binaries to the Release when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
