# Run the whole app (built frontend served by FastAPI) as one local container.
# Data + encrypted secrets live in the named volume. Bound to localhost only.

services:
  mailagent:
    build: .
    container_name: mailagent
    ports:
      - '127.0.0.1:8765:8765'
    environment:
      # Origin(s) allowed to call this local backend. Point it at your Vercel URL
      # when the frontend is hosted there (or export MAIL_AGENT_CORS_ORIGINS).
      MAIL_AGENT_CORS_ORIGINS: ${MAIL_AGENT_CORS_ORIGINS:-https://mail-agent-hazel.vercel.app}
    volumes:
      - mailagent-data:/data
    restart: unless-stopped

volumes:
  mailagent-data:
