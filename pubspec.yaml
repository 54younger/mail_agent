name: mail_agent
description: AI-powered email management with semantic search and job application tracking.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database + vector search (HNSW)
  objectbox: ^4.0.0
  objectbox_flutter_libs: ^4.0.0

  # Email / IMAP
  enough_mail: ^3.0.0

  # Secure credential storage (Windows Credential Manager / iOS Keychain)
  flutter_secure_storage: ^9.2.2
  flutter_secure_storage_windows: ^3.1.2

  # File system
  path_provider: ^2.1.4
  path: ^1.9.0

  # HTTP (Claude API + model downloads)
  dio: ^5.7.0
  http: ^1.2.2

  # Checksum validation for downloaded models
  crypto: ^3.0.5

  # Immutable data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  objectbox_generator: ^4.0.0
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
